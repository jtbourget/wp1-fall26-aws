name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Workflow-level permissions apply to all jobs by default.
# We restrict this to read-only access for code.
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EB_APPLICATION: wp1-fall26-aws
  EB_ENVIRONMENT: wp1-fall26-aws-dev
  API_PROJECT: src/Wp1Fall26Aws.Api
  API_DLL: Wp1Fall26Aws.Api.dll

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Wp1Fall26Aws.slnx

      - name: Build
        run: dotnet build Wp1Fall26Aws.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Wp1Fall26Aws.slnx --configuration Release --no-build

  deploy:
    needs: build-test
    # This ensures the deploy job ONLY runs on pushes to main (or manual triggers)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    
    # We grant the OIDC permission ONLY to the deploy job.
    permissions:
      contents: read
      id-token: write
      
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Note: Removed the --no-build flag from the original script here because  
      # this job runs on a fresh runner and needs to build the code before publishing.
      - name: Publish
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --output publish

      - name: Write Procfile
        run: |
          echo "web: dotnet ${{ env.API_DLL }} --urls http://0.0.0.0:5000" > publish/Procfile
          cat publish/Procfile

      - name: Package source bundle
        run: |
          VERSION="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "VERSION_LABEL=$VERSION" >> "$GITHUB_ENV"
          echo "BUNDLE=wp1-$VERSION.zip" >> "$GITHUB_ENV"
          cd publish && zip -qr "../wp1-$VERSION.zip" . && cd ..

      - name: Debug OIDC Token Claims
        run: |
          RESPONSE=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          TOKEN=$(echo "$RESPONSE" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          PAYLOAD=$(echo "$PAYLOAD" | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          DECODED=$(echo "$PAYLOAD" | base64 -d 2>/dev/null)
          echo "=== OIDC CLAIMS FROM GITHUB ==="
          echo "$DECODED" | jq '{aud, iss, sub, repository, repository_owner, ref}'
 
      - name: Debug AWS OIDC inputs
        run: |
          echo "AWS_DEPLOY_ROLE=${{ vars.AWS_DEPLOY_ROLE }}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          role-session-name: wp1-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm identity
        run: aws sts get-caller-identity

      - name: Upload source bundle
        run: |
          EB_BUCKET="elasticbeanstalk-${{ env.AWS_REGION }}-944036659002"
          echo "EB_BUCKET=$EB_BUCKET" >> "$GITHUB_ENV"
          aws s3 cp "$BUNDLE" "s3://$EB_BUCKET/$EB_APPLICATION/$BUNDLE"

      - name: Create application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$VERSION_LABEL" \
            --source-bundle "S3Bucket=$EB_BUCKET,S3Key=$EB_APPLICATION/$BUNDLE" \
            --description "${GITHUB_SHA::7} by ${GITHUB_ACTOR}"

      - name: Deploy to environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "$VERSION_LABEL"

      - name: Wait for the environment to go green
        run: |
          echo "Waiting for $EB_ENVIRONMENT to finish updating..."
          for i in $(seq 1 40); do
            read -r STATUS HEALTH <<< "$(aws elasticbeanstalk describe-environments \
              --environment-names "$EB_ENVIRONMENT" \
              --query 'Environments[0].[Status,Health]' --output text)"
            echo "  status=$STATUS health=$HEALTH"
            if [ "$STATUS" = "Ready" ]; then
              [ "$HEALTH" = "Green" ] && { echo "Deployed."; exit 0; }
              echo "Environment is Ready but health is $HEALTH."
              echo "Recent events:"
              aws elasticbeanstalk describe-events \
                --environment-name "$EB_ENVIRONMENT" --max-items 15 \
                --query 'Events[].[Severity,Message]' --output text
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for the environment."
          exit 1