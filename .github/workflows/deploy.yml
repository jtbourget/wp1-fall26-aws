name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: eb-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  EB_APPLICATION: wp1-fall26-aws
  EB_ENVIRONMENT: wp1-fall26-aws-env
  VERSION_LABEL: deploy-${{ github.sha }}-${{ github.run_attempt }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Do not add "environment:" unless your IAM trust policy
    # explicitly uses an environment-scoped OIDC subject.

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish src/Wp1Fall26Aws.Api -c Release -o publish

      - name: Add Procfile to publish output
        run: cp Procfile publish/Procfile

      - name: Zip deployment package
        run: |
          cd publish
          zip -r ../deploy.zip .

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Upload deployment package
        run: |
          BUCKET=$(aws elasticbeanstalk create-storage-location \
            --query S3Bucket --output text)
          S3_KEY=\"wp1-fall26-aws/${VERSION_LABEL}.zip\"
          echo \"EB_BUCKET=$BUCKET\" >> \"$GITHUB_ENV\"
          echo \"EB_S3_KEY=$S3_KEY\" >> \"$GITHUB_ENV\"
          aws s3 cp deploy.zip \"s3://$BUCKET/$S3_KEY\"

      - name: Create application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name \"$EB_APPLICATION\" \
            --version-label \"$VERSION_LABEL\" \
            --source-bundle S3Bucket=\"$EB_BUCKET\",S3Key=\"$EB_S3_KEY\" \
            --process

      - name: Deploy to the environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name \"$EB_ENVIRONMENT\" \
            --version-label \"$VERSION_LABEL\"

      - name: Wait for a healthy environment
        run: |
          for i in $(seq 1 40); do
            read -r STATUS HEALTH <<< \"$(aws elasticbeanstalk describe-environments \
              --environment-names \"$EB_ENVIRONMENT\" \
              --query 'Environments[0].[Status,Health]' \
              --output text)\"
            echo \"status=$STATUS health=$HEALTH\"

            if [ \"$STATUS\" = \"Ready\" ]; then
              if [ \"$HEALTH\" = \"Green\" ]; then
                echo \"Deployment completed successfully.\"
                exit 0
              fi

              aws elasticbeanstalk describe-events \
                --environment-name \"$EB_ENVIRONMENT\" \
                --max-items 20 \
                --query 'Events[].[Severity,Message]' \
                --output table
              exit 1
            fi

            sleep 15
          done

          echo \"Timed out waiting for Elastic Beanstalk.\"
          aws elasticbeanstalk describe-events \
            --environment-name \"$EB_ENVIRONMENT\" \
            --max-items 20 \
            --query 'Events[].[Severity,Message]' \
            --output table
          exit 1